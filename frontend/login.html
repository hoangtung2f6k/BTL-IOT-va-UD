<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA HOME - Đăng nhập</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #0b1021; display: flex; align-items: center; justify-content: center; height: 100vh; color: #fff; }
        .login-box { background: #1c2438; padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        .logo-icon { width: 50px; height: 50px; background: #f97316; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; margin: 0 auto 20px; }
        h2 { font-size: 24px; margin-bottom: 8px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; color: #cbd5e1; font-size: 13px; font-weight: 500; }
        .input-group input { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #f97316; }
        .btn-login { width: 100%; background: #f97316; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-login:hover { background: #ea580c; }
        #error-msg { color: #f43f5e; font-size: 13px; margin-bottom: 20px; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo-icon"><i class="fas fa-home"></i></div>
        <h2>AURA HOME</h2>
        <p>Đăng nhập vào hệ thống giám sát</p>
        
        <div id="error-msg">Tên đăng nhập hoặc mật khẩu không đúng!</div>

        <form id="login-form">
            <div class="input-group">
                <label>Tên đăng nhập (Username / Email)</label>
                <input type="text" id="username" placeholder="Nhập tài khoản..." required>
            </div>
            <div class="input-group">
                <label>Mật khẩu (Password)</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu..." required>
            </div>
            <button type="submit" class="btn-login">ĐĂNG NHẬP</button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.querySelector('.btn-login');
            btn.textContent = 'Đang đăng nhập...';
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch('http://localhost:3000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (res.ok && data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'index.html';
                } else {
                    document.getElementById('error-msg').style.display = 'block';
                    document.getElementById('error-msg').textContent = data.message || 'Đăng nhập thất bại';
                }
            } catch (err) {
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('error-msg').textContent = 'Lỗi kết nối Server';
            } finally {
                btn.textContent = 'ĐĂNG NHẬP';
            }
        });
    </script>
</body>
</html>
